{% extends "admin/base_site.html" %}

{% block content %}

<h1>Daily Payment Summary</h1>

<h2>{{ today }}</h2>

<table>
    <tr>
        <th>Total Transactions</th>
        <td>{{ total_transactions }}</td>
    </tr>

    <tr>
        <th>Successful Payments</th>
        <td>{{ successful_transactions }}</td>
    </tr>

    <tr>
        <th>Failed Payments</th>
        <td>{{ failed_transactions }}</td>
    </tr>

    <tr>
        <th>Total Amount</th>
        <td>₹{{ total_amount }}</td>
    </tr>
</table>

{% endblock %}
